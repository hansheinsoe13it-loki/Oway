<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Burmese Voice Reply</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Myanmar", sans-serif;
    }

    body {
      background: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #131c31;
      border: 1px solid #263554;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #2b3c5e;
      background: #0b1120;
      color: #e2e8f0;
      font-size: 0.92rem;
      margin-bottom: 24px;
      outline: none;
    }

    .talk-btn {
      width: 156px;
      height: 156px;
      border-radius: 50%;
      border: none;
      background: #10b981;
      color: #042f2e;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s ease, background 0.2s ease;
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.3);
    }

    .talk-btn:active {
      transform: scale(0.96);
    }

    .talk-btn.listening {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.35);
    }

    .talk-btn.speaking {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.35);
    }

    .mic-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .state-text {
      margin-top: 22px;
      font-size: 1rem;
      font-weight: 600;
      color: #6ee7b7;
      min-height: 28px;
    }

    .sub-text {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #94a3b8;
      min-height: 22px;
      line-height: 1.45;
    }

    .stop-btn {
      margin-top: 18px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">🎙️ ပြောလိုက် — မြန်မာလို ပြန်ပြောမည်</div>

    <select id="langSelect" aria-label="Spoken language">
      <option value="auto" selected>Auto Detect (English default)</option>
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="zh-CN">Chinese (Mandarin)</option>
      <option value="ja-JP">Japanese</option>
      <option value="ko-KR">Korean</option>
      <option value="th-TH">Thai</option>
      <option value="hi-IN">Hindi</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
    </select>

    <button id="talkBtn" class="talk-btn" type="button">
      <span class="mic-icon">🎤</span>
      <span id="talkLabel">နှိပ်ပြီးပြောပါ</span>
    </button>

    <div id="stateText" class="state-text">အသင့်ရှိပါသည်</div>
    <div id="subText" class="sub-text">ခလုတ်ကိုနှိပ်ပြီး ကြိုက်တဲ့ဘာသာစကားနဲ့ ပြောပါ</div>

    <button id="stopBtn" class="stop-btn" type="button">⏹️ ရပ်မည်</button>
  </div>

  <script>
    const langSelect = document.getElementById("langSelect");
    const talkBtn = document.getElementById("talkBtn");
    const talkLabel = document.getElementById("talkLabel");
    const stateText = document.getElementById("stateText");
    const subText = document.getElementById("subText");
    const stopBtn = document.getElementById("stopBtn");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let replyTimer = null;
    let lastHeard = "";
    const audio = new Audio();

    function setUI(mode, mainMsg, detailMsg = "") {
      talkBtn.classList.remove("listening", "speaking");
      if (mode === "listening") {
        talkBtn.classList.add("listening");
        talkLabel.textContent = "နားထောင်နေသည်";
      } else if (mode === "speaking") {
        talkBtn.classList.add("speaking");
        talkLabel.textContent = "ပြန်ပြောနေသည်";
      } else {
        talkLabel.textContent = "နှိပ်ပြီးပြောပါ";
      }
      stateText.textContent = mainMsg;
      subText.textContent = detailMsg;
    }

    function stopAll() {
      clearTimeout(replyTimer);
      if (recognition && isListening) {
        try { recognition.stop(); } catch (_) {}
      }
      isListening = false;
      if (window.AndroidBridge && typeof window.AndroidBridge.stopSpeaking === "function") {
        window.AndroidBridge.stopSpeaking();
      }
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      audio.pause();
      audio.currentTime = 0;
      setUI("idle", "ရပ်လိုက်ပါပြီ", "ပြန်ပြောရန် ခလုတ်ကို ထပ်နှိပ်ပါ");
    }

    function getSpeechLang() {
      return langSelect.value === "auto" ? "en-US" : langSelect.value;
    }

    function getSourceLang() {
      return langSelect.value === "auto" ? "auto" : langSelect.value.split("-")[0];
    }

    async function autoReplyInBurmese(spokenText) {
      const clean = (spokenText || "").trim();
      if (!clean) {
        setUI("idle", "အသံမကြားရပါ", "ထပ်မံ နှိပ်ပြီး ပြောကြည့်ပါ");
        return;
      }

      setUI("idle", "ခဏစောင့်ပါ...", "မြန်မာလို ပြန်ပြောရန် ပြင်ဆင်နေသည်");
      const sl = getSourceLang();
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=my&dt=t&q=${encodeURIComponent(clean)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const burmese = (data[0] || []).map(x => x[0]).filter(Boolean).join("").trim();

        if (!burmese) {
          setUI("idle", "ပြန်မပြောနိုင်ပါ", "အသံကို ထပ်မံ စမ်းကြည့်ပါ");
          return;
        }

        // စက္ကန့်အနည်းငယ် (1.2s) ခြားပြီး မြန်မာစကားသံနဲ့ အလိုအလျောက် ပြန်ပြောမည်
        replyTimer = setTimeout(() => {
          speakBurmeseReply(burmese);
        }, 1200);
      } catch (err) {
        setUI("idle", "ချိတ်ဆက်မှု အခက်အခဲရှိသည်", "အင်တာနက် / VPN အခြေအနေ စစ်ဆေးပါ");
      }
    }

    function speakBurmeseReply(burmeseText) {
      setUI("speaking", "မြန်မာလို ပြန်ပြောနေပါသည်", "အလိုအလျောက် ဖတ်ပြနေသည်");

      if (window.AndroidBridge && typeof window.AndroidBridge.speakBurmese === "function") {
        window.AndroidBridge.speakBurmese(burmeseText);
        setTimeout(() => {
          if (!isListening) setUI("idle", "အသင့်ရှိပါသည်", "ထပ်ပြောလိုလျှင် ခလုတ်ကို နှိပ်ပါ");
        }, Math.max(2500, burmeseText.length * 140));
        return;
      }

      if ("speechSynthesis" in window) {
        const voices = window.speechSynthesis.getVoices();
        const myVoice = voices.find(v =>
          v.lang.toLowerCase().startsWith("my") ||
          v.name.toLowerCase().includes("burmese") ||
          v.name.toLowerCase().includes("myanmar")
        );
        if (myVoice) {
          const utter = new SpeechSynthesisUtterance(burmeseText);
          utter.voice = myVoice;
          utter.lang = myVoice.lang || "my-MM";
          utter.onend = () => setUI("idle", "ပြီးပါပြီ", "ထပ်ပြောလိုလျှင် ခလုတ်ကို နှိပ်ပါ");
          utter.onerror = () => playBurmeseAudio(burmeseText);
          window.speechSynthesis.speak(utter);
          return;
        }
      }

      playBurmeseAudio(burmeseText);
    }

    function playBurmeseAudio(text) {
      const chunks = text.match(/.{1,180}(\s|$)/g) || [text];
      let idx = 0;

      function nextChunk() {
        if (idx >= chunks.length) {
          setUI("idle", "ပြီးပါပြီ", "ထပ်ပြောလိုလျှင် ခလုတ်ကို နှိပ်ပါ");
          return;
        }
        const piece = chunks[idx++].trim();
        if (!piece) return nextChunk();
        audio.src = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=my&q=${encodeURIComponent(piece)}`;
        audio.onended = nextChunk;
        audio.onerror = () => setUI("idle", "အသံထွက်ရန် အခက်အခဲရှိသည်", "ဖုန်း TTS / Browser အသံကို စစ်ပါ");
        audio.play().catch(() => setUI("idle", "အသံဖွင့်၍ မရပါ", "ဖုန်းအသံ ခွင့်ပြုချက်ကို စစ်ပါ"));
      }

      nextChunk();
    }

    async function startListening() {
      stopAll();
      lastHeard = "";

      if (window.AndroidBridge && typeof window.AndroidBridge.startNativeSpeech === "function") {
        setUI("listening", "နားထောင်နေပါသည်...", "စကားပြောပါ");
        window.AndroidBridge.startNativeSpeech(getSpeechLang());
        return;
      }

      if (!SpeechRecognition) {
        setUI("idle", "အသံဖမ်းစနစ် မရရှိပါ", "Chrome သို့မဟုတ် Android App ဖြင့် စမ်းပါ");
        return;
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
        } catch (e) {
          setUI("idle", "Microphone ခွင့်ပြုချက် မရပါ", "Settings တွင် Microphone ကို Allow ပေးပါ");
          return;
        }
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = getSpeechLang();

      recognition.onstart = () => {
        isListening = true;
        setUI("listening", "နားထောင်နေပါသည်...", "ပြောပြီးရင် ခဏရပ်ပေးပါ");
      };

      recognition.onresult = (event) => {
        let combined = "";
        for (let i = 0; i < event.results.length; i++) {
          combined += event.results[i][0].transcript;
        }
        lastHeard = combined.trim();
      };

      recognition.onerror = (event) => {
        isListening = false;
        setUI("idle", "အသံဖမ်းမရပါ (" + event.error + ")", "VPN ပိတ်ပြီး သို့မဟုတ် Permission စစ်ပြီး ထပ်နှိပ်ပါ");
      };

      recognition.onend = () => {
        isListening = false;
        if (lastHeard) {
          autoReplyInBurmese(lastHeard);
        } else {
          setUI("idle", "အသင့်ရှိပါသည်", "ခလုတ်ကို နှိပ်ပြီး ပြောပါ");
        }
      };

      try {
        recognition.start();
      } catch (err) {
        isListening = false;
        setUI("idle", "စတင်၍ မရပါ", err.message);
      }
    }

    window.onNativeSpeechResult = (text) => {
      autoReplyInBurmese(text);
    };

    window.onNativeSpeechStatus = (msg) => {
      setUI("idle", msg, "");
    };

    talkBtn.addEventListener("click", () => {
      if (isListening) {
        stopAll();
      } else {
        startListening();
      }
    });

    stopBtn.addEventListener("click", stopAll);

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
