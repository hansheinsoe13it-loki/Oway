<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice to Burmese</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --box: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Myanmar", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      overflow: hidden;
    }

    h1 {
      font-size: 1.15rem;
      margin-bottom: 14px;
    }

    .top-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 12px;
      align-items: stretch;
    }

    select, button {
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      padding: 10px 12px;
      color: var(--text);
      background: var(--box);
      max-width: 100%;
    }

    select {
      width: 100%;
      min-width: 0;
    }

    .mic-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #052e16;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .mic-btn.listening {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .panel {
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
      gap: 8px;
    }

    textarea {
      width: 100%;
      min-height: 68px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.98rem;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    .output {
      font-size: 1.25rem;
      font-weight: 600;
      color: #6ee7b7;
      min-height: 48px;
      line-height: 1.6;
      word-break: break-word;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn-sm {
      background: #334155;
      border: none;
      padding: 7px 11px;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .auto-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      color: var(--muted);
      cursor: pointer;
    }

    .auto-toggle input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .status {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #fbbf24;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🌐 Voice to Burmese</h1>

    <div class="top-bar">
      <select id="inputLang" title="Input language">
        <option value="auto" selected>Detect Language (Auto)</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="zh-CN">Chinese (zh-CN)</option>
        <option value="ja-JP">Japanese (ja-JP)</option>
        <option value="ko-KR">Korean (ko-KR)</option>
        <option value="th-TH">Thai (th-TH)</option>
        <option value="hi-IN">Hindi (hi-IN)</option>
        <option value="es-ES">Spanish (es-ES)</option>
        <option value="fr-FR">French (fr-FR)</option>
      </select>

      <button id="micBtn" class="mic-btn" type="button">🎤 စကားပြောရန်</button>
    </div>

    <div class="panel">
      <div class="label-row">
        <span>မူရင်းစာသား</span>
        <span id="detectedTag"></span>
      </div>
      <textarea id="sourceText" placeholder="စကားပြောပါ သို့မဟုတ် စာရိုက်ပါ..."></textarea>
    </div>

    <div class="panel">
      <div class="label-row">
        <span>မြန်မာဘာသာပြန်</span>
      </div>
      <div id="burmeseText" class="output">...</div>
    </div>

    <div class="footer-row">
      <label class="auto-toggle">
        <input id="autoSpeak" type="checkbox" checked />
        <span>အလိုအလျောက် ဖတ်မည်</span>
      </label>

      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button id="speakBtn" class="btn-sm" type="button">🔊 ပြန်ဖတ်</button>
        <button id="stopBtn" class="btn-sm" type="button">⏹️ ရပ်</button>
        <button id="clearBtn" class="btn-sm" type="button">🗑️ ရှင်း</button>
      </div>
    </div>

    <div id="status" class="status">အသင့်ရှိပါသည်။</div>
  </div>

  <script>
    const langSelect = document.getElementById("inputLang");
    const micBtn = document.getElementById("micBtn");
    const sourceText = document.getElementById("sourceText");
    const burmeseText = document.getElementById("burmeseText");
    const detectedTag = document.getElementById("detectedTag");
    const autoSpeak = document.getElementById("autoSpeak");
    const speakBtn = document.getElementById("speakBtn");
    const stopBtn = document.getElementById("stopBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let timer = null;
    let lastBurmese = "";
    const audio = new Audio();

    const setStatus = (msg) => { statusEl.textContent = msg; };

    function getSpeechLang() {
      return langSelect.value === "auto" ? "en-US" : langSelect.value;
    }

    function getTranslateSourceLang() {
      return langSelect.value === "auto" ? "auto" : langSelect.value.split("-")[0];
    }

    async function translateAndSpeak(text) {
      const clean = text.trim();
      if (!clean) {
        burmeseText.textContent = "...";
        detectedTag.textContent = "";
        return;
      }

      setStatus("ဘာသာပြန်နေပါသည်...");
      const sl = getTranslateSourceLang();
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=my&dt=t&q=${encodeURIComponent(clean)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const translated = (data[0] || []).map(x => x[0]).filter(Boolean).join("");
        const detected = data[2] || "";

        detectedTag.textContent = detected ? `Detected: ${detected}` : "";
        burmeseText.textContent = translated || "(ဘာသာပြန်မရပါ)";
        lastBurmese = translated;
        setStatus("ပြီးပါပြီ။");

        if (translated && autoSpeak.checked) {
          speakBurmese(translated);
        }
      } catch (e) {
        setStatus("ဘာသာပြန်ရာတွင် အခက်အခဲရှိပါသည်။");
      }
    }

    function speakBurmese(text) {
      const clean = (text || "").trim();
      if (!clean) return;
      stopSpeaking();

      if (window.AndroidBridge && typeof window.AndroidBridge.speakBurmese === "function") {
        setStatus("🔊 ဖတ်ပြနေပါသည်...");
        window.AndroidBridge.speakBurmese(clean);
        return;
      }

      if ("speechSynthesis" in window) {
        const voices = window.speechSynthesis.getVoices();
        const myVoice = voices.find(v =>
          v.lang.toLowerCase().startsWith("my") ||
          v.name.toLowerCase().includes("burmese") ||
          v.name.toLowerCase().includes("myanmar")
        );
        if (myVoice) {
          const u = new SpeechSynthesisUtterance(clean);
          u.voice = myVoice;
          u.lang = myVoice.lang || "my-MM";
          u.onstart = () => setStatus("🔊 ဖတ်ပြနေပါသည်...");
          u.onend = () => setStatus("ပြီးပါပြီ။");
          u.onerror = () => playFallbackAudio(clean);
          window.speechSynthesis.speak(u);
          return;
        }
      }

      playFallbackAudio(clean);
    }

    function playFallbackAudio(text) {
      const chunks = text.match(/.{1,180}(\s|$)/g) || [text];
      let idx = 0;

      function next() {
        if (idx >= chunks.length) {
          setStatus("ပြီးပါပြီ။");
          return;
        }
        const chunk = chunks[idx++].trim();
        if (!chunk) return next();
        audio.src = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=my&q=${encodeURIComponent(chunk)}`;
        audio.onplay = () => setStatus("🔊 ဖတ်ပြနေပါသည်...");
        audio.onended = next;
        audio.onerror = () => setStatus("စာသားပြသထားပါသည်။");
        audio.play().catch(() => setStatus("အသံဖွင့်ရန် 'ပြန်ဖတ်' ကို နှိပ်ပါ။"));
      }
      next();
    }

    function stopSpeaking() {
      if (window.AndroidBridge && typeof window.AndroidBridge.stopSpeaking === "function") {
        window.AndroidBridge.stopSpeaking();
      }
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      audio.pause();
      audio.currentTime = 0;
    }

    micBtn.addEventListener("click", () => {
      if (window.AndroidBridge && typeof window.AndroidBridge.startNativeSpeech === "function") {
        stopSpeaking();
        window.AndroidBridge.startNativeSpeech(getSpeechLang());
        return;
      }

      if (!SpeechRecognition) {
        setStatus("❌ ဤ Browser တွင် SpeechRecognition မပါဝင်ပါ။");
        return;
      }

      if (isListening && recognition) {
        recognition.stop();
        return;
      }

      stopSpeaking();
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = getSpeechLang();

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("listening");
        micBtn.textContent = "⏹️ ရပ်ရန်";
        setStatus("နားထောင်နေပါသည်...");
      };

      recognition.onresult = (e) => {
        let out = "";
        for (let i = 0; i < e.results.length; i++) out += e.results[i][0].transcript;
        sourceText.value = out;
        clearTimeout(timer);
        timer = setTimeout(() => translateAndSpeak(out), 350);
      };

      recognition.onerror = (e) => {
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 စကားပြောရန်";
        setStatus("❌ Error: " + e.error);
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 စကားပြောရန်";
        if (sourceText.value.trim()) translateAndSpeak(sourceText.value);
      };

      try {
        recognition.start();
      } catch (err) {
        setStatus("❌ " + err.message);
      }
    });

    window.onNativeSpeechResult = (t) => {
      sourceText.value = t;
      translateAndSpeak(t);
    };

    window.onNativeSpeechStatus = (m) => setStatus(m);

    sourceText.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => translateAndSpeak(sourceText.value), 450);
    });

    speakBtn.addEventListener("click", () => {
      const t = burmeseText.textContent !== "..." ? burmeseText.textContent : lastBurmese;
      speakBurmese(t);
    });

    stopBtn.addEventListener("click", () => {
      stopSpeaking();
      setStatus("ရပ်လိုက်ပါပြီ။");
    });

    clearBtn.addEventListener("click", () => {
      stopSpeaking();
      sourceText.value = "";
      burmeseText.textContent = "...";
      detectedTag.textContent = "";
      lastBurmese = "";
      setStatus("ရှင်းလင်းပြီးပါပြီ။");
    });

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
